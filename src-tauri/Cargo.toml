[package]
name = "ai-usage-checker"
version = "0.2.4"
description = "Claude / ChatGPT usage widget"
authors = ["a_lonely_designer <lonelydesigners@gmail.com>"]
license = "LicenseRef-Proprietary"
publish = false
edition = "2021"

[lib]
name = "ai_usage_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
fastrand = "2"
base64 = "0.22"
percent-encoding = "2"
tauri-plugin-global-shortcut = "2"
# zip 기능은 배포 중단된 zip 버전에 묶여 있어 끈다. Windows는 NSIS(.exe) 설치 파일로 업데이트하므로 필요 없다.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
