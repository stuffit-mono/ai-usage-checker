# 릴리스 빌드: v로 시작하는 태그(예: v0.2.0)를 올리면 Windows·macOS 설치 파일을 빌드해
# 초안(draft) 릴리스에 올린다. 앱 자동 업데이트가 읽는 latest.json도 함께 올라간다.
# 초안을 확인한 뒤 GitHub에서 "Publish release"를 눌러야 사용자 앱에 업데이트가 뜬다.
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           업데이트 서명 키 파일(~/.tauri/ai-usage-checker.key)의 내용
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  키 비밀번호 (비밀번호 없이 만들었으면 등록하지 않아도 됨)
name: 릴리스

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Usage Checker ${{ github.ref_name }}"
          releaseBody: "변경 내용은 커밋 기록을 참고하세요."
          releaseDraft: true
          prerelease: false
          # 앱은 zip 압축 없이 NSIS 설치 파일(.exe)로 업데이트한다
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
